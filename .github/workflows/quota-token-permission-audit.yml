name: GitHub Actions Credential Read Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quota-token-permission-audit.yml'
      - 'quota-monitor/check_token_permissions.mjs'
      - 'quota-monitor/tests/test_token_permissions.mjs'
      - 'quota-monitor/README.md'
      - '.github/workflows/conformance.yml'
permissions: {}
concurrency:
  group: quota-token-read-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Audit temporary workflow credential
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node quota-monitor/check_token_permissions.mjs
