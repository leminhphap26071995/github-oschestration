name: Annotation CLI Synthetic Failure Observer

on:
  workflow_run:
    workflows:
      - "Annotation CLI Synthetic Failure"
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  collect:
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Checkout observer source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare evidence directory
        run: mkdir -p evidence

      - name: Install gh-annotations CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install swfz/gh-annotations

      - name: Collect annotations with CLI and verify the synthetic message
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EXPECTED_MARKER: "SYNTHETIC_ANNOTATION_MESSAGE: annotation CLI retrieval proof v3"
        shell: bash
        run: |
          set -euo pipefail

          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" > evidence/source-run.json
          jq -e --argjson id "$RUN_ID" --argjson attempt "$RUN_ATTEMPT" '
            .id == $id and .run_attempt == $attempt
            and .name == "Annotation CLI Synthetic Failure"
            and .path == ".github/workflows/annotation-cli-synthetic-failure.yml"
            and .conclusion == "failure"
          ' evidence/source-run.json >/dev/null

          RUN_URL="$(jq -r '.html_url' evidence/source-run.json)"
          gh annotations -repo "$REPOSITORY" -json > evidence/gh-annotations-all-latest.json

          # gh-annotations lists the latest run per workflow; bind the output
          # to the exact completed source run before evaluating message content.
          jq --arg run_url "$RUN_URL" '
            [.[] | select(.workflow_url == $run_url)]
          ' evidence/gh-annotations-all-latest.json > evidence/gh-annotations-exact-run.json

          jq -e --arg marker "$EXPECTED_MARKER" '
            any(.[]; ((.message // "") | contains($marker)))
          ' evidence/gh-annotations-exact-run.json >/dev/null

          jq -n \
            --arg repository "$REPOSITORY" \
            --arg run_url "$RUN_URL" \
            --argjson run_id "$RUN_ID" \
            --argjson attempt "$RUN_ATTEMPT" \
            --arg marker "$EXPECTED_MARKER" \
            --slurpfile exact evidence/gh-annotations-exact-run.json \
            '{
              result: "PASS",
              repository: $repository,
              source_run_id: $run_id,
              source_run_attempt: $attempt,
              source_run_url: $run_url,
              cli: "swfz/gh-annotations",
              exact_run_annotation_count: ($exact[0] | length),
              expected_message_marker: $marker,
              retrieved_messages: ($exact[0] | map(.message))
            }' > evidence/cli-verification-receipt.json

          jq -r '
            .[] |
            "workflow=\(.workflow_name)\nrun=\(.workflow_url)\njob=\(.job_name)\nlevel=\(.annotation_level)\nmessage=\(.message)\n"
          ' evidence/gh-annotations-exact-run.json > evidence/chatgpt-annotation-readout.txt

          {
            echo "# Annotation CLI self-test"
            echo
            echo "- Source run: $RUN_URL"
            echo "- Exact-run annotations retrieved: $(jq 'length' evidence/gh-annotations-exact-run.json)"
            echo "- Expected message marker: $EXPECTED_MARKER"
            echo
            cat evidence/chatgpt-annotation-readout.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CLI output and message evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annotation-cli-self-test-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
