name: Portable AI Workflow Conformance
on:
  push:
    paths-ignore:
      - '.ai-workflow/**'
  pull_request:
    paths-ignore:
      - '.ai-workflow/**'
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/validate_workspace.py --root .
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m unittest discover -s quota-monitor/tests -p 'test_*.py' -v
      - run: node --test quota-monitor/tests/test_app_tokens.mjs

  emit-annotation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Emit a uniquely identifiable annotation for the exact-run collector test
        shell: bash
        run: echo "::warning title=Annotation API smoke test::GH_ANNOTATIONS_SMOKE_${{ github.run_id }}"

  collect-annotations:
    needs:
      - validate
      - emit-annotation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_PROMPT_DISABLED: "1"
      GH_NO_UPDATE_NOTIFIER: "1"
      EXPECTED_MARKER: GH_ANNOTATIONS_SMOKE_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Collect annotations for this exact repository and run
        shell: bash
        run: |
          set -euo pipefail
          python scripts/collect_github_annotations.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --output exact-run-annotations.json
          jq -e --arg repo "$GITHUB_REPOSITORY" --argjson run_id "$GITHUB_RUN_ID" \
            '.repository == $repo and .run_id == $run_id' exact-run-annotations.json
          jq -e --arg marker "$EXPECTED_MARKER" \
            'any(.annotations[]; ((.message // "") | contains($marker)))' exact-run-annotations.json
          {
            echo "## Exact-run GitHub Actions annotations"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Workflow run ID: $GITHUB_RUN_ID"
            echo "- Check-run IDs: $(jq -r '[.check_runs[].check_run_id] | join(", ")' exact-run-annotations.json)"
            echo "- Annotation records: $(jq '.annotation_count' exact-run-annotations.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install gh-annotations extension from its upstream repository
        run: gh extension install swfz/gh-annotations

      - name: Collect latest workflow annotations as JSON
        shell: bash
        run: |
          set -euo pipefail
          gh annotations --repo "$GITHUB_REPOSITORY" --json | tee latest-workflow-annotations.json
          jq -e 'type == "array"' latest-workflow-annotations.json
          {
            echo "## GitHub Actions annotations (latest per workflow)"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Collector workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Annotation records: $(jq 'length' latest-workflow-annotations.json)"
            echo
            jq -r '.[] | "- [\(.annotation_level // "unknown")] \(.workflow_name // "unknown workflow") / \(.job_name // "unknown job"): \(.message // "")"' latest-workflow-annotations.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload annotation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gh-annotations-${{ github.run_id }}
          path: |
            exact-run-annotations.json
            latest-workflow-annotations.json
          if-no-files-found: warn
          retention-days: 7
