name: Portable AI Workflow Conformance
on:
  push:
    paths-ignore:
      - '.ai-workflow/**'
  pull_request:
    paths-ignore:
      - '.ai-workflow/**'
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/validate_workspace.py --root .
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m unittest discover -s quota-monitor/tests -p 'test_*.py' -v
      - run: node --test quota-monitor/tests/test_app_tokens.mjs

  collect-annotations:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_PROMPT_DISABLED: "1"
      GH_NO_UPDATE_NOTIFIER: "1"
    steps:
      - name: Install gh-annotations extension from its upstream repository
        run: gh extension install swfz/gh-annotations

      - name: Collect latest workflow annotations as JSON
        shell: bash
        run: |
          set -euo pipefail
          gh annotations --repo "$GITHUB_REPOSITORY" --json | tee annotations.json
          jq -e 'type == "array"' annotations.json
          {
            echo "## GitHub Actions annotations"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Source workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Annotation records: $(jq 'length' annotations.json)"
            echo
            jq -r '.[] | "- [" + (.annotation_level // "unknown") + "] " + (.workflow_name // "unknown workflow") + " / " + (.job_name // "unknown job") + ": " + (.message // "")' annotations.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload annotation JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gh-annotations-${{ github.run_id }}
          path: annotations.json
          if-no-files-found: warn
          retention-days: 7
