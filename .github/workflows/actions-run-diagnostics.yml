name: GitHub Actions Run Diagnostics Observer

on:
  workflow_run:
    workflows:
      - GitHub Actions Credential Read Audit
      - Portable AI Workflow Conformance
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: actions-diagnostics-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Checkout trusted observer source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect source-run diagnostics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OBSERVER_SHA: ${{ github.sha }}
        run: node quota-monitor/diagnostics/collect.mjs
