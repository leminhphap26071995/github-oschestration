name: No-Runner Annotation Readback

on:
  workflow_run:
    workflows:
      - "No-Runner Annotation Recovery Observer"
    types: [completed]
    branches:
      - test/annotation-no-runner-20261122

permissions: {}

concurrency:
  group: no-runner-annotation-readback-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.name == 'No-Runner Annotation Recovery Observer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Retrieve exact observer annotations and publish plain Markdown receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OBSERVER_RUN_ID: ${{ github.event.workflow_run.id }}
          OBSERVER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/readback

          gh api "repos/$REPOSITORY/actions/runs/$OBSERVER_RUN_ID/attempts/$OBSERVER_ATTEMPT/jobs?per_page=100" \
            > evidence/readback/observer-jobs.json
          CHECK_RUN_ID="$(jq -r '.jobs[] | select(.name == "recover") | .id' evidence/readback/observer-jobs.json | head -n1)"
          test -n "$CHECK_RUN_ID"

          gh api "repos/$REPOSITORY/check-runs/$CHECK_RUN_ID" \
            > evidence/readback/observer-check-run.json
          set +e
          gh api "repos/$REPOSITORY/check-runs/$CHECK_RUN_ID/annotations?per_page=100" \
            > evidence/readback/observer-annotations.json \
            2> evidence/readback/annotation-fetch-error.txt
          ANNOTATION_EXIT=$?
          set -e
          if [[ "$ANNOTATION_EXIT" -ne 0 ]]; then
            echo "ANNOTATION_API_FETCH_FAILED" > evidence/readback/annotation-fetch-status.txt
          else
            echo "ANNOTATION_API_FETCH_SUCCEEDED" > evidence/readback/annotation-fetch-status.txt
          fi

          gh api "repos/$REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100" \
            > evidence/readback/source-workflow-runs.json
          SOURCE_RUN_JSON="$(jq -c --arg path ".github/workflows/zz-synthetic-invalid-workflow.yml" '
            [.workflow_runs[] | select(.path == $path)]
            | sort_by(.created_at) | last
          ' evidence/readback/source-workflow-runs.json)"
          SOURCE_RUN_ID="$(jq -r '.id // empty' <<< "$SOURCE_RUN_JSON")"
          test -n "$SOURCE_RUN_ID"
          SOURCE_RUN_ATTEMPT="$(jq -r '.run_attempt // 1' <<< "$SOURCE_RUN_JSON")"
          SOURCE_RUN_URL="$(jq -r '.html_url' <<< "$SOURCE_RUN_JSON")"

          gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT/jobs?per_page=100" \
            > evidence/readback/source-jobs.json
          test "$(jq '.total_count' evidence/readback/source-jobs.json)" -eq 0

          set +e
          gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/logs" \
            > evidence/readback/source-logs-response.txt \
            2> evidence/readback/source-logs-error.txt
          SOURCE_LOG_EXIT=$?
          set -e

          OBSERVER_URL="$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$OBSERVER_RUN_ID"
          REPORT="evidence/readback/CHATGPT-ANNOTATION-RECEIPT.md"
          {
            echo "# Annotation-first recovery — real no-runner syntax failure"
            echo
            echo "- Repository: $REPOSITORY"
            echo "- Defect source SHA: $SOURCE_SHA"
            echo "- Source workflow run: $SOURCE_RUN_URL (run_id=$SOURCE_RUN_ID, attempt=$SOURCE_RUN_ATTEMPT)"
            echo "- Source conclusion: $(jq -r '.conclusion' <<< "$SOURCE_RUN_JSON")"
            echo "- Source jobs: $(jq -r '.total_count' evidence/readback/source-jobs.json)"
            echo "- Source runner_id: NOT PRESENT (no job object exists; do not normalize to zero)"
            echo "- Source steps: NOT PRESENT (no job object exists)"
            if [[ "$SOURCE_LOG_EXIT" -eq 0 ]]; then
              echo "- Source log endpoint: returned content"
            else
              echo "- Source log endpoint: unavailable (HTTP/API error captured in source-logs-error.txt)"
            fi
            echo "- Independent observer: $OBSERVER_URL (run_id=$OBSERVER_RUN_ID)"
            echo "- Annotation check_run_id: $CHECK_RUN_ID"
            echo "- Annotation API fetch: $(cat evidence/readback/annotation-fetch-status.txt)"
            echo
            echo "## Actual annotation messages retrieved from GitHub"
            echo
            if [[ "$ANNOTATION_EXIT" -eq 0 ]]; then
              jq -r '.[] | "- **\(.annotation_level // "unknown")** \(.message) — `\(.path // "unknown")` line \(.start_line // "n/a"), column \(.start_column // "n/a")"' \
                evidence/readback/observer-annotations.json
            else
              echo "The annotation endpoint failed; see annotation-fetch-error.txt. Do not treat the diagnostic text below as a retrieved annotation."
            fi
            echo
            echo "## Diagnostic generated from the actual malformed YAML"
            echo
            echo '~~~text'
            cat "docs/diagnostics/no-runner/$SOURCE_SHA/actionlint-diagnostics.txt" 2>/dev/null || echo "See the observer source branch diagnostic file."
            echo '~~~'
            echo
            echo "## Classification"
            echo
            echo "- Root cause: WORKFLOW_YAML_SYNTAX_ERROR"
            echo "- Evidence source: actionlint parsed the committed malformed YAML; GitHub Problem Matcher attempted to attach it to the observer Check Run."
            echo "- Source run itself had no jobs, no runner assignment record, and no retrievable job logs."
            echo "- Quota: NOT INDICATED. No-job/no-log state is not quota evidence."
            echo
            echo "## ChatGPT retrieval path"
            echo
            echo "- Read this Markdown file directly through GitHub repository contents."
            echo "- Raw annotation JSON and exact Check Run metadata are stored beside this report when available."
            echo "- No ZIP download or source console log is required to read a successfully retrieved message body."
          } > "$REPORT"

          for FILE in "$REPORT" evidence/readback/observer-annotations.json evidence/readback/observer-jobs.json evidence/readback/observer-check-run.json evidence/readback/source-workflow-runs.json evidence/readback/source-jobs.json evidence/readback/source-logs-error.txt evidence/readback/annotation-fetch-error.txt evidence/readback/annotation-fetch-status.txt; do
            [[ -f "$FILE" ]] || continue
            DEST="docs/diagnostics/no-runner/$SOURCE_SHA/$(basename "$FILE")"
            CONTENT_B64="$(base64 -w0 "$FILE")"
            gh api --method PUT "repos/$REPOSITORY/contents/$DEST" \
              -f message="docs: publish annotation-first receipt for $SOURCE_SHA" \
              -f content="$CONTENT_B64" \
              -f branch="$SOURCE_BRANCH" >/dev/null
          done

          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
