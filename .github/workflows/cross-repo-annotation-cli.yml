name: Cross-Repository GitHub Annotation CLI

on:
  push:
    branches:
      - tests/exhausted-github-quota
    paths:
      - ".ai-workflow/diagnostics/requests/GM-48-annotations.json"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the validated GitHub annotations extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install swfz/gh-annotations

      - name: Resolve an existing least-privilege credential for the target private repository
        id: credentials
        env:
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          CANDIDATE_TARGET_REPO_READ_TOKEN: ${{ secrets.TARGET_REPO_READ_TOKEN }}
          CANDIDATE_CROSS_REPO_GH_TOKEN: ${{ secrets.CROSS_REPO_GH_TOKEN }}
          CANDIDATE_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CANDIDATE_GH_PAT: ${{ secrets.GH_PAT }}
          CANDIDATE_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          CANDIDATE_USER_BILLING_TOKEN: ${{ secrets.USER_BILLING_TOKEN }}
          EXECUTOR_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";
          import { createAppJwt } from "./quota-monitor/prepare_app_tokens.mjs";

          const api = process.env.GITHUB_API_URL || "https://api.github.com";
          const request = JSON.parse(await readFile(".ai-workflow/diagnostics/requests/GM-48-annotations.json", "utf8"));
          const target = request.repository;
          const [owner, repo] = target.split("/");
          const selectedRun = request.runs.find(item => item.latest_for_workflow === true);
          if (!selectedRun) throw new Error("LATEST_TARGET_RUN_MISSING");
          if (!/^[a-f0-9]{40}$/.test(request.test_source_sha || "")) throw new Error("INVALID_TARGET_TEST_SOURCE_SHA");

          async function canRead(token) {
            const headers = {
              Accept: "application/vnd.github+json",
              Authorization: "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "cross-repository-annotation-cli",
            };
            const run = await fetch(api + "/repos/" + target + "/actions/runs/" + selectedRun.run_id, { headers });
            if (!run.ok) return { ok: false, stage: "actions", status: run.status };
            const check = await fetch(api + "/repos/" + target + "/check-runs/" + selectedRun.check_run_id + "/annotations?per_page=1", { headers });
            if (!check.ok) return { ok: false, stage: "checks", status: check.status };
            return { ok: true };
          }

          const candidates = [
            ["TARGET_REPO_READ_TOKEN", process.env.CANDIDATE_TARGET_REPO_READ_TOKEN],
            ["CROSS_REPO_GH_TOKEN", process.env.CANDIDATE_CROSS_REPO_GH_TOKEN],
            ["GH_TOKEN", process.env.CANDIDATE_GH_TOKEN],
            ["GH_PAT", process.env.CANDIDATE_GH_PAT],
            ["GITHUB_PAT", process.env.CANDIDATE_GITHUB_PAT],
            ["USER_BILLING_TOKEN", process.env.CANDIDATE_USER_BILLING_TOKEN],
            ["EXECUTOR_GITHUB_TOKEN", process.env.EXECUTOR_GITHUB_TOKEN],
          ];
          const attempts = [];
          let selected = null;

          for (const [name, token] of candidates) {
            if (!token) {
              attempts.push(name + "=ABSENT");
              continue;
            }
            const probe = await canRead(token);
            attempts.push(name + "=" + (probe.ok ? "READ_OK" : probe.stage + "_HTTP_" + probe.status));
            if (probe.ok) {
              selected = { name, token };
              break;
            }
          }

          if (!selected && process.env.GITHUB_APP_ID && process.env.GITHUB_APP_PRIVATE_KEY) {
            const jwt = createAppJwt(process.env.GITHUB_APP_ID, process.env.GITHUB_APP_PRIVATE_KEY);
            const jwtHeaders = {
              Accept: "application/vnd.github+json",
              Authorization: "Bearer " + jwt,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "cross-repository-annotation-cli",
            };
            let installation = null;
            for (let page = 1; page <= 100; page += 1) {
              const response = await fetch(api + "/app/installations?per_page=100&page=" + page, { headers: jwtHeaders });
              if (!response.ok) throw new Error("APP_INSTALLATION_DISCOVERY_HTTP_" + response.status);
              const rows = await response.json();
              installation = rows.find(item => item.account?.login?.toLowerCase() === owner.toLowerCase()) || installation;
              if (installation || rows.length < 100) break;
            }
            if (!installation) {
              attempts.push("GITHUB_APP=NOT_INSTALLED");
            } else {
              const response = await fetch(api + "/app/installations/" + installation.id + "/access_tokens", {
                method: "POST",
                headers: { ...jwtHeaders, "Content-Type": "application/json" },
                body: JSON.stringify({
                  repositories: [repo],
                  permissions: { actions: "read", checks: "read", contents: "read" },
                }),
              });
              if (!response.ok) {
                attempts.push("GITHUB_APP_TOKEN_HTTP_" + response.status);
              } else {
                const data = await response.json();
                const probe = await canRead(data.token);
                attempts.push("GITHUB_APP=" + (probe.ok ? "READ_OK" : probe.stage + "_HTTP_" + probe.status));
                if (probe.ok) selected = { name: "GITHUB_APP_INSTALLATION", token: data.token };
              }
            }
          } else if (!selected) {
            attempts.push("GITHUB_APP_CREDENTIALS=ABSENT");
          }

          if (!selected) throw new Error("NO_CROSS_REPO_READ_CREDENTIAL:" + attempts.join(","));
          process.stdout.write("::add-mask::" + selected.token + "\n");
          await appendFile(process.env.GITHUB_ENV, "TARGET_GH_TOKEN=" + selected.token + "\n");
          await appendFile(process.env.GITHUB_OUTPUT, "target_source_sha=" + request.test_source_sha + "\n");
          console.log("CROSS_REPO_CREDENTIAL_READY source=" + selected.name +
            " target=" + target + " permissions=verified-actions-read,checks-read");
          NODE

      - name: Set up target test runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact source runs and collect annotations
        shell: bash
        run: |
          set -euo pipefail
          export GH_TOKEN="$TARGET_GH_TOKEN"
          request=".ai-workflow/diagnostics/requests/GM-48-annotations.json"
          mkdir -p evidence
          TARGET_REPOSITORY="$(jq -r '.repository' "$request")"

          jq -c '.runs[]' "$request" | while IFS= read -r target; do
            run_id="$(jq -r '.run_id' <<<"$target")"
            attempt="$(jq -r '.run_attempt' <<<"$target")"
            sha="$(jq -r '.head_sha' <<<"$target")"
            check_run_id="$(jq -r '.check_run_id' <<<"$target")"
            expected_count="$(jq -r '.expected_annotation_count' <<<"$target")"

            gh api "repos/$TARGET_REPOSITORY/actions/runs/$run_id" > "evidence/run-$run_id.json"
            jq -e --argjson id "$run_id" --argjson attempt "$attempt" --arg sha "$sha" '
              .id == $id and .run_attempt == $attempt and .head_sha == $sha
            ' "evidence/run-$run_id.json" >/dev/null

            python -B scripts/collect_github_annotations.py \
              --repository "$TARGET_REPOSITORY" --run-id "$run_id" \
              --check-run-id "$check_run_id" --output "evidence/exact-run-$run_id.json"

            jq -e --argjson id "$run_id" --argjson check "$check_run_id" --argjson count "$expected_count" '
              .run_id == $id and .check_runs[0].check_run_id == $check
              and .annotation_count == $count
            ' "evidence/exact-run-$run_id.json" >/dev/null
          done

          latest_run_id="$(jq -r '.runs[] | select(.latest_for_workflow == true) | .run_id' "$request")"
          latest_run_url="https://github.com/$TARGET_REPOSITORY/actions/runs/$latest_run_id"
          gh annotations -repo "$TARGET_REPOSITORY" -json > evidence/gh-annotations-latest.json
          jq --arg url "$latest_run_url" '[.[] | select(.workflow_url == $url)]' \
            evidence/gh-annotations-latest.json > evidence/gh-annotations-exact-latest.json

          expected="$(jq -r '.runs[] | select(.latest_for_workflow == true) | .expected_annotation_count' "$request")"
          actual="$(jq 'length' evidence/gh-annotations-exact-latest.json)"
          test "$actual" -eq "$expected"
          latest_exact_file="evidence/exact-run-$latest_run_id.json"
          jq -r '[.annotations[].message] | sort | join("\\n")' "$latest_exact_file" > evidence/exact-messages.txt
          jq -r '[.[].message] | sort | join("\\n")' evidence/gh-annotations-exact-latest.json > evidence/cli-messages.txt
          diff -u evidence/exact-messages.txt evidence/cli-messages.txt

          {
            echo "# Cross-repository GitHub annotation evidence"
            echo
            echo "- Target repository: `$TARGET_REPOSITORY`"
            echo "- CLI: `gh extension install swfz/gh-annotations` + `gh annotations -repo TARGET -json`"
            echo "- Exact-run collector: `scripts/collect_github_annotations.py`"
            echo
            for file in evidence/exact-run-*.json; do
              echo "## Run $(jq -r '.run_id' "$file") / attempt $(jq -r '.run_attempt' "$file")"
              jq -r '.annotations[] | [.check_run_id, .job_name, .annotation_level, .message] | @tsv' "$file"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout exact target repository source
        uses: actions/checkout@v4
        with:
          repository: leminhphap-improvement/ai-workflow-archtiecture
          ref: ${{ steps.credentials.outputs.target_source_sha }}
          token: ${{ env.TARGET_GH_TOKEN }}
          path: target
          persist-credentials: false

      - name: Run the target repository conformance commands
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/validate_workspace.py --root . | tee ../evidence/target-structure-validation.json
          python -B -m unittest discover -s tests -v 2>&1 | tee ../evidence/target-unittest.log
          test_count="$(awk '/^Ran [0-9]+ tests?/{print $2}' ../evidence/target-unittest.log | tail -n 1)"
          test -n "$test_count"
          jq -n --arg repository "leminhphap-improvement/ai-workflow-archtiecture" --arg source_sha "${{ steps.credentials.outputs.target_source_sha }}" --argjson tests_run "$test_count" '{repository:$repository, source_sha:$source_sha, tests_run:$tests_run, result:"PASS"}' > ../evidence/target-test-receipt.json

      - name: Upload annotation and conformance evidence
        uses: actions/upload-artifact@v4
        with:
          name: GM-48-github-annotations-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
        if: always()
