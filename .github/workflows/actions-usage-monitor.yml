name: GitHub Actions Usage Monitor

on:
  schedule:
    - cron: "23 2 * * *"
  push:
    branches: [main]
    paths:
      - "quota-monitor/**"
      - ".github/workflows/actions-usage-monitor.yml"

permissions:
  contents: read

concurrency:
  group: actions-usage-monitor
  cancel-in-progress: false

jobs:
  collect:
    if: vars.QUOTA_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout monitor source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Checkout private report repository
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.REPORT_REPOSITORY }}
          token: ${{ secrets.REPORT_TOKEN }}
          path: report-store

      - name: Collect usage and render private dashboard
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          USER_BILLING_TOKEN: ${{ secrets.USER_BILLING_TOKEN }}
          ORG_BILLING_TOKENS_JSON: ${{ secrets.ORG_BILLING_TOKENS_JSON }}
        run: python quota-monitor/collect.py --report-dir report-store

      - name: Persist dashboard to private repository
        working-directory: report-store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md usage-latest.json usage-history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update private Actions usage dashboard"
            git push
          fi
