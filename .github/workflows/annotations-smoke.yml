name: GitHub Actions Annotation API Smoke Test

on:
  push:
    branches:
      - tests/exhausted-github-quota
    paths:
      - ".github/workflows/annotations-smoke.yml"
      - "tests/github-actions-annotations/**"

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: annotations-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emit-annotation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Emit a uniquely identifiable GitHub annotation
        shell: bash
        run: |
          echo "::warning title=GH Annotations smoke test::GH_ANNOTATIONS_SMOKE_${GITHUB_RUN_ID}"

  collect-annotations:
    needs: emit-annotation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_PROMPT_DISABLED: "1"
      RUN_ID: ${{ github.run_id }}
      EXPECTED_MARKER: GH_ANNOTATIONS_SMOKE_${{ github.run_id }}
    steps:
      - name: Checkout exact trigger revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fetch jobs and resolve producer check-run ID
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            | tee jobs.json

          CHECK_RUN_ID="$(jq -er '
            .jobs[]
            | select(.name == "emit-annotation")
            | . as $job
            | ($job.check_run_url | split("/")[-1]) as $check_run_id
            | if $check_run_id == ($job.id | tostring)
              then $check_run_id
              else error("job ID and check-run URL do not match")
              end
          ' jobs.json)"

          echo "CHECK_RUN_ID=$CHECK_RUN_ID" >> "$GITHUB_ENV"
          echo "Resolved producer job $CHECK_RUN_ID from run $RUN_ID"

      - name: Fetch annotations for the exact producer check run
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN_ID/annotations?per_page=100" \
            | tee annotations.json

          jq -e --arg marker "$EXPECTED_MARKER" \
            'any(.[]; ((.message // "") | contains($marker)))' \
            annotations.json

      - name: Upload exact-run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gh-annotations-api-${{ github.run_id }}
          path: |
            jobs.json
            annotations.json
          if-no-files-found: warn
          retention-days: 7
