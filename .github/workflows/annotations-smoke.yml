name: GitHub Actions Annotation API Smoke Test

on:
  push:
    branches:
      - tests/exhausted-github-quota
    paths:
      - ".github/workflows/annotations-smoke.yml"
      - "scripts/collect_github_annotations.py"
      - "tests/test_github_annotations.py"
      - "tests/github-actions-annotations/**"

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: annotations-smoke-${{ github.ref }
  cancel-in-progress: false

jobs:
  emit-annotation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Emit a uniquely identifiable GitHub annotation
        shell: bash
        run: echo "::warning title=GH Annotations smoke test::GH_ANNOTATIONS_SMOKE_${{ github.run_id }"

  collect-annotations:
    needs: emit-annotation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }
      EXPECTED_MARKER: GH_ANNOTATIONS_SMOKE_${{ github.run_id }
    steps:
      - name: Checkout exact trigger revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }
          fetch-depth: 1

      - name: Collect annotations for the exact repository and run
        shell: bash
        run: |
          set -euo pipefail
          python scripts/collect_github_annotations.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --output annotations.json
          jq -e --arg repo "$GITHUB_REPOSITORY" --argjson run_id "$GITHUB_RUN_ID" \
            '.repository == $repo and .run_id == $run_id' annotations.json
          jq -e --arg marker "$EXPECTED_MARKER" \
            'any(.annotations[]; ((.message // "") | contains($marker)))' annotations.json
          {
            echo "## Exact-run GitHub Actions annotations"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Workflow run ID: $GITHUB_RUN_ID"
            echo "- Check-run IDs: $(jq -r '[.check_runs[].check_run_id] | join(", ")' annotations.json)"
            echo "- Annotation records: $(jq '.annotation_count' annotations.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact-run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gh-annotations-api-${{ github.run_id }
          path: annotations.json
          if-no-files-found: warn
          retention-days: 7
