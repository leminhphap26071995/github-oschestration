name: No-Runner Annotation Recovery Observer

on:
  push:
    branches:
      - test/annotation-no-runner-20261122
    paths:
      - ".github/workflows/zz-synthetic-invalid-workflow.yml"

permissions: {}

concurrency:
  group: no-runner-annotation-observer-${{ github.sha }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Checkout exact defective source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Detect the genuine workflow defect and emit provider annotations
        id: diagnose
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence/no-runner
          echo "::add-matcher::.github/actionlint-problem-matcher.json"
          set +e
          actionlint -oneline .github/workflows/zz-synthetic-invalid-workflow.yml \
            2>&1 | tee evidence/no-runner/actionlint-diagnostics.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          test "$status" -ne 0
          test -s evidence/no-runner/actionlint-diagnostics.txt

      - name: Recover no-runner source metadata and publish plain Markdown evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          FIXTURE_PATH: .github/workflows/zz-synthetic-invalid-workflow.yml
          OBSERVER_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/no-runner
          gh api "repos/$REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100" \
            > evidence/no-runner/workflow-runs.json

          RUN_ID="$(jq -r --arg path "$FIXTURE_PATH" '
            [.workflow_runs[] | select(.path == $path)]
            | sort_by(.created_at) | last | .id // empty
          ' evidence/no-runner/workflow-runs.json)"
          test -n "$RUN_ID"
          RUN_JSON="$(jq -c --argjson id "$RUN_ID" '.workflow_runs[] | select(.id == $id)' evidence/no-runner/workflow-runs.json)"
          RUN_ATTEMPT="$(jq -r '.run_attempt // 1' <<< "$RUN_JSON")"
          RUN_URL="$(jq -r '.html_url' <<< "$RUN_JSON")"

          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            > evidence/no-runner/jobs.json
          JOB_COUNT="$(jq '.total_count' evidence/no-runner/jobs.json)"
          test "$JOB_COUNT" -eq 0

          set +e
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/logs" \
            > evidence/no-runner/source-run-logs-response.txt \
            2> evidence/no-runner/source-run-logs-error.txt
          LOG_STATUS=$?
          set -e
          if [[ "$LOG_STATUS" -eq 0 ]]; then
            LOG_STATE="AVAILABLE"
          else
            LOG_STATE="UNAVAILABLE (GitHub returned an error for a run with no jobs)"
          fi

          OBSERVER_URL="$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$OBSERVER_RUN_ID"
          {
            echo "# Real workflow syntax failure — no-runner annotation recovery"
            echo
            echo "- Repository: $REPOSITORY"
            echo "- Defect source SHA: $SOURCE_SHA"
            echo "- Defective file: $FIXTURE_PATH"
            echo "- GitHub source run: $RUN_URL (run_id=$RUN_ID, attempt=$RUN_ATTEMPT)"
            echo "- Source run conclusion: $(jq -r '.conclusion' <<< "$RUN_JSON")"
            echo "- Exact-attempt jobs: $JOB_COUNT"
            echo "- runner_id: NOT PRESENT — GitHub returned zero job records, so no runner_id field exists"
            echo "- steps: NOT PRESENT — there is no job object whose steps array can be read"
            echo "- Source run log retrieval: $LOG_STATE"
            echo "- Independent diagnostic observer: $OBSERVER_URL (run_id=$OBSERVER_RUN_ID)"
            echo
            echo "## Diagnostic produced from the actual malformed YAML"
            echo
            echo '~~~text'
            cat evidence/no-runner/actionlint-diagnostics.txt
            echo '~~~'
            echo
            echo "## Annotation retrieval contract"
            echo
            echo "- actionlint read the committed invalid workflow file and generated the diagnostic; no error message was pre-written in the fixture."
            echo "- The registered GitHub Actions problem matcher converts the diagnostic into a Check Run annotation on the observer job."
            echo "- ChatGPT must retrieve the observer job's Check Run annotations by its exact check_run_id after the observer run completes. The source run itself has no job/check-run annotation record."
            echo "- Quota classification: UNKNOWN / NOT INDICATED. Zero source jobs and unavailable logs are not quota evidence."
            echo
            echo "## Raw source evidence"
            echo
            echo "- `workflow-runs.json`"
            echo "- `jobs.json`"
            echo "- `source-run-logs-error.txt`"
          } > evidence/no-runner/CHATGPT-READOUT.md

          for FILE in evidence/no-runner/CHATGPT-READOUT.md evidence/no-runner/workflow-runs.json evidence/no-runner/jobs.json evidence/no-runner/actionlint-diagnostics.txt evidence/no-runner/source-run-logs-error.txt; do
            CONTENT_B64="$(base64 -w0 "$FILE")"
            gh api --method PUT "repos/$REPOSITORY/contents/docs/diagnostics/no-runner/$SOURCE_SHA/$(basename "$FILE")" \
              -f message="docs: publish no-runner diagnostic evidence for $SOURCE_SHA" \
              -f content="$CONTENT_B64" \
              -f branch="$BRANCH" >/dev/null
          done

          cat evidence/no-runner/CHATGPT-READOUT.md >> "$GITHUB_STEP_SUMMARY"
